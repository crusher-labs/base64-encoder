<!DOCTYPE html>
<html lang="en"
      data-default-theme="minimal"
      data-theme-lock="minimal"
      data-default-mode="light"
      data-default-brand="#0ea5e9">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Encoder/Decoder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/crusher-ui.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/themes/minimal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/static/tool-shell.css">
    <script defer src="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/static/tool-shell.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tool-mono { font-family: 'JetBrains Mono', monospace; }

        .tool-stack { display: grid; gap: var(--crusher-spacing-6); max-width: 42rem; margin-inline: auto; }
        .tool-section { padding: var(--crusher-spacing-6); display: grid; gap: var(--crusher-spacing-4); }
        .tool-section h2 {
            margin: 0 0 var(--crusher-spacing-2);
            padding-bottom: var(--crusher-spacing-3);
            border-bottom: 1px solid var(--crusher-border-primary);
            font-size: var(--crusher-font-size-xl);
            color: var(--crusher-text-primary);
        }
        .tool-label { display: block; margin-bottom: var(--crusher-spacing-1); font-size: var(--crusher-font-size-sm); color: var(--crusher-text-secondary); }
        .tool-radio-row { display: flex; flex-wrap: wrap; gap: var(--crusher-spacing-4); justify-content: center; }
        .tool-radio { display: inline-flex; align-items: center; gap: var(--crusher-spacing-2); cursor: pointer; color: var(--crusher-text-primary); }
        .tool-radio input { accent-color: var(--crusher-color-brand-primary); inline-size: 1.1rem; block-size: 1.1rem; }
        .tool-action-row { display: flex; justify-content: center; }
        textarea.crusher-tool-control { min-block-size: 6rem; padding: var(--crusher-spacing-3); }
        input[type="file"].crusher-tool-control { padding: var(--crusher-spacing-2); }
        .tool-action { padding-inline: var(--crusher-spacing-6); padding-block: var(--crusher-spacing-2); border-radius: var(--crusher-radius-full); font-weight: 600; }
        .tool-file-result { display: none; padding: var(--crusher-spacing-4); border-radius: var(--crusher-radius-lg); border: 1px solid var(--crusher-border-primary); background: var(--crusher-background-muted); }
        .tool-file-result[data-visible="true"] { display: block; }
        .tool-copy-btn { margin-top: var(--crusher-spacing-2); background: transparent; border: 0; padding: 0; cursor: pointer; color: var(--crusher-color-brand-primary); font-weight: 500; font-size: var(--crusher-font-size-sm); }
    </style>
</head>
<body class="crusher-tool-page">

    <main class="crusher-tool-shell">
        <header class="crusher-tool-header">
            <h1 class="crusher-tool-title">Base64 Encoder/Decoder</h1>
            <p class="crusher-tool-lede">Encode or decode text and files to/from Base64.</p>
        </header>

        <div class="tool-stack">
            <section class="crusher-tool-surface tool-section">
                <div class="tool-radio-row">
                    <label class="tool-radio">
                        <input type="radio" name="mode" value="encode" checked>
                        <span>Encode</span>
                    </label>
                    <label class="tool-radio">
                        <input type="radio" name="mode" value="decode">
                        <span>Decode</span>
                    </label>
                </div>
            </section>

            <section class="crusher-tool-surface tool-section">
                <h2>Text</h2>
                <div>
                    <label for="text-input" class="tool-label">Input Text</label>
                    <textarea id="text-input" rows="4" class="crusher-tool-control tool-mono" placeholder="Enter text here..."></textarea>
                </div>
                <div class="tool-action-row">
                    <button id="convert-text-btn" type="button" class="crusher-tool-action tool-action">Convert</button>
                </div>
                <div>
                    <label for="text-output" class="tool-label">Output</label>
                    <textarea id="text-output" rows="4" readonly class="crusher-tool-control tool-mono" placeholder="Result will appear here..."></textarea>
                </div>
            </section>

            <section class="crusher-tool-surface tool-section">
                <h2>File</h2>
                <div>
                    <label for="file-input" class="tool-label">Select File</label>
                    <input type="file" id="file-input" class="crusher-tool-control">
                </div>
                <div id="file-result" class="tool-file-result">
                    <p class="tool-label">Base64 Output:</p>
                    <textarea id="file-output" rows="4" readonly class="crusher-tool-control tool-mono"></textarea>
                    <button id="copy-file-btn" type="button" class="tool-copy-btn">Copy to Clipboard</button>
                </div>
            </section>
        </div>
    </main>

    <a href="https://tools.muhammadhassaanjaved.com/" id="hub-bubble" class="crusher-tool-fab" title="View All Tools" target="_blank" rel="noopener noreferrer">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
    </a>

    <crusher-style-switcher
      default-theme="minimal"
      default-brand="#0ea5e9"
      hide-themes
      hide-theme-color></crusher-style-switcher>
    <script type="module" src="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/crusher-ui.standalone.esm.js"></script>

    <script>
        const textInput = document.getElementById('text-input');
        const textOutput = document.getElementById('text-output');
        const convertTextBtn = document.getElementById('convert-text-btn');
        const modeRadios = document.getElementsByName('mode');

        function getMode() {
            for (const radio of modeRadios) {
                if (radio.checked) return radio.value;
            }
            return 'encode';
        }

        function convertText() {
            const mode = getMode();
            const input = textInput.value;
            try {
                if (mode === 'encode') {
                    textOutput.value = btoa(unescape(encodeURIComponent(input)));
                } else {
                    textOutput.value = decodeURIComponent(escape(atob(input)));
                }
            } catch (e) {
                textOutput.value = 'Error: Invalid input for ' + mode;
            }
        }

        convertTextBtn.addEventListener('click', convertText);

        const fileInput = document.getElementById('file-input');
        const fileResult = document.getElementById('file-result');
        const fileOutput = document.getElementById('file-output');
        const copyFileBtn = document.getElementById('copy-file-btn');

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                let result = reader.result;
                if (typeof result === 'string' && result.includes(',')) {
                    result = result.split(',')[1];
                }
                fileOutput.value = result;
                fileResult.dataset.visible = 'true';
            };
            reader.readAsDataURL(file);
        });

        copyFileBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(fileOutput.value);
                copyFileBtn.textContent = 'Copied!';
            } catch {
                fileOutput.select();
                document.execCommand('copy');
                copyFileBtn.textContent = 'Copied!';
            }
            setTimeout(() => { copyFileBtn.textContent = 'Copy to Clipboard'; }, 2000);
        });
    </script>
</body>
</html>
